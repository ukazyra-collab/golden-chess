<title>Golden Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,600;1,6..96,700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: board-first column — player bars hug the board like the two sides of a tournament clock;
   at >=860px wide a scoresheet panel sits to the right. Gold is reserved for the golden move only. */
:root {
  --ground: #0f1716;
  --panel: #162120;
  --raise: #1f2c2a;
  --line: #2c3c39;
  --bone: #ece6d8;
  --muted: #93a39f;
  --gold: #e7b44a;
  --gold-hi: #f7d98f;
  --gold-lo: #9c6f1c;
  --danger: #e2685a;
  --ok: #8fc7a0;
  --sq-light: #e2dccb;
  --sq-dark: #5d7a74;
  --hl-last: rgba(158, 219, 238, .42);
  --hl-sel: rgba(158, 219, 238, .66);
  --hl-pre: rgba(226, 104, 90, .55);
  --hl-gold: rgba(231, 180, 74, .66);
  --dot: rgba(10, 20, 18, .26);
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --f-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --top-h: 52px;
  --bar-h: 48px;
  --strip-h: 34px;
  --ctl-h: 56px;
  --bs: 352px;
  color-scheme: dark;
}
.app[data-board="walnut"] { --sq-light: #ecd3a9; --sq-dark: #a97b50; }
.app[data-board="marble"] { --sq-light: #e7e6e1; --sq-dark: #8d9aa3; }
.app[data-board="slate"] { --sq-light: #e2dccb; --sq-dark: #5d7a74; }

html, body { height: 100%; background: var(--ground); color: var(--bone); }
body { font-family: var(--f-ui); font-size: 14px; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 8px;
}

/* ---- top bar ---- */
.top { height: var(--top-h); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 26px; height: 26px; flex: none; }
.wordmark { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 22px; letter-spacing: .2px; white-space: nowrap; }
.wordmark b { color: var(--gold); font-weight: 700; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--raise); color: var(--bone); }
.icon-btn svg { width: 20px; height: 20px; }
.btn-new { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--raise); font-weight: 700; font-size: 13.5px; white-space: nowrap; display: flex; align-items: center; }
.btn-new svg { width: 18px; height: 18px; display: none; }
@media (max-width: 400px) { .wordmark { font-size: 20px; } .brand { gap: 8px; } .brand svg { width: 24px; height: 24px; } .btn-new { padding: 0 11px; } .top-actions { gap: 2px; } }
@media (max-width: 379px) { .btn-new { width: 38px; padding: 0; justify-content: center; } .btn-new span { display: none; } .btn-new svg { display: block; } }
@media (max-width: 360px) {
  .nbtn { width: 34px; } .navs { gap: 2px; } .ctl { gap: 6px; }
  .gbtn { padding: 0 10px; gap: 8px; } .gbtn svg { width: 19px; height: 19px; }
  .clock { min-width: 78px; font-size: 19px; padding: 0 8px; }
  .wordmark { font-size: 19px; }
}
.btn-new:hover { background: #283836; }

/* ---- stage grid ---- */
.stage { flex: 1; min-height: 0; display: grid; justify-content: center; align-content: center;
  grid-template-columns: var(--bs);
  grid-template-areas: "ptop" "strip" "board" "pbot" "ctl" "ana" "review";
  row-gap: 6px; }
.app.wide .stage { grid-template-columns: var(--bs) minmax(280px, 340px); column-gap: 22px; align-content: center;
  grid-template-areas: "ptop side" "board side" "pbot side" "ctl side"; }
.app.wide .strip { display: none; }
.app.wide .stage > .ana, .app.wide .stage > #review { display: none; }

/* ---- player bars ---- */
.pbar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; min-width: 0; }
.pbar.top-bar { grid-area: ptop; }
.pbar.bottom-bar { grid-area: pbot; }
.avatar { width: 36px; height: 36px; border-radius: 9px; background: var(--raise); flex: none; display: grid; place-items: center; overflow: hidden; }
.avatar .pc-ic { width: 30px; height: 30px; background-size: 100%; }
.pmeta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.pname { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14.5px; white-space: nowrap; min-width: 0; }
.pname .nm { overflow: hidden; text-overflow: ellipsis; }
.gstar { width: 15px; height: 15px; flex: none; }
.gstar .fill { fill: var(--gold); }
.gstar.used .fill { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .7; }
.psub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; }
.caps { display: flex; align-items: center; }
.caps i { width: 15px; height: 15px; margin-right: -5px; background-size: 100%; display: inline-block; }
.caps i.gap { margin-left: 6px; }
.adv { margin-left: 8px; font-weight: 700; color: var(--bone); font-size: 12px; }
.thinking { display: inline-flex; gap: 3px; margin-left: 2px; }
.thinking i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }

.clock { flex: none; min-width: 92px; height: 38px; padding: 0 10px; border-radius: 8px; background: var(--panel); color: var(--muted);
  display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
.clock.on { background: var(--bone); color: #13201e; }
.clock.low { color: var(--danger); }
.clock.on.low { background: #f5d9d4; color: #9b2417; }
.clock.flag { background: var(--danger); color: #fff; }
.clock[hidden] { display: none !important; }

/* ---- move strip (phones) ---- */
.strip { grid-area: strip; height: var(--strip-h); display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-weight: 600; font-size: 13.5px; }
.strip::-webkit-scrollbar { display: none; }
.strip .num { color: var(--muted); padding: 0 2px 0 8px; font-variant-numeric: tabular-nums; }
.strip .num:first-child { padding-left: 2px; }
.mv { padding: 5px 7px; border-radius: 6px; color: var(--bone); }
.mv:hover { background: var(--raise); }
.mv.cur { background: var(--raise); box-shadow: inset 0 -2px 0 var(--muted); }
.mv.gold { color: var(--gold); }
.mv.gold.cur { box-shadow: inset 0 -2px 0 var(--gold); }
.strip .empty { color: var(--muted); font-weight: 500; font-size: 12.5px; padding-left: 2px; overflow: hidden; text-overflow: ellipsis; }

/* ---- board ---- */
.board-wrap { grid-area: board; position: relative; width: var(--bs); height: var(--bs); }
.board { position: absolute; inset: 0; border-radius: 4px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  background: conic-gradient(var(--sq-dark) 0 25%, var(--sq-light) 0 50%, var(--sq-dark) 0 75%, var(--sq-light) 0); background-size: 25% 25%; }
.board .layer { position: absolute; inset: 0; pointer-events: none; }
.sqx { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; }
.hl-last { background: var(--hl-last); }
.hl-sel { background: var(--hl-sel); }
.hl-pre { background: var(--hl-pre); }
.hl-gold { background: var(--hl-gold); box-shadow: inset 0 0 0 2px rgba(255, 226, 150, .55); }
.hl-check { background: radial-gradient(circle, rgba(255, 70, 50, .95) 0%, rgba(230, 50, 40, .55) 32%, rgba(200, 30, 30, 0) 70%); }
.hl-hover { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .6); }
.hl-hover.g { box-shadow: inset 0 0 0 4px var(--gold-hi); }
.coord { position: absolute; font-size: calc(var(--bs) * .026); font-weight: 800; line-height: 1; }
.coord.rk { left: 3%; top: 4%; }
.coord.fl { right: 4%; bottom: 3%; }
.coord.on-l { color: var(--sq-dark); } .coord.on-d { color: var(--sq-light); }
.dot::after { content: ""; position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; background: var(--dot); }
.ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--bs) * .0095) var(--dot); }
.gdot::after { content: ""; position: absolute; left: 37%; top: 37%; width: 26%; height: 26%; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px rgba(80, 52, 6, .35), 0 0 10px 2px rgba(247, 217, 143, .55); }
.gdot.hot::after { left: 30%; top: 30%; width: 40%; height: 40%; }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 100%; background-repeat: no-repeat; will-change: transform; transform-origin: 50% 50%; }
.pc.lift { z-index: 5; }
.pc.dragging { z-index: 6; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .35)); }
.pc.ghost { opacity: .35; }
.board.armed { box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 26px rgba(231, 180, 74, .45); }
.board.armed .pc.gcan { filter: drop-shadow(0 0 4px rgba(247, 217, 143, .95)); }
.fx-ring { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; pointer-events: none; z-index: 7; }
.fx-ring::before { content: ""; position: absolute; inset: -10%; border-radius: 50%; border: 3px solid var(--gold-hi); box-shadow: 0 0 18px 4px rgba(247, 217, 143, .7), inset 0 0 12px rgba(247, 217, 143, .6); animation: gring .75s ease-out forwards; }
.fx-spark { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px 2px rgba(247, 217, 143, .9); left: calc(50% - 3.5px); top: calc(50% - 3.5px); animation: gspark .7s ease-out forwards; }
@keyframes gring { 0% { transform: scale(.3); opacity: 1 } 100% { transform: scale(1.9); opacity: 0 } }
@keyframes gspark { 0% { transform: translate(0, 0) scale(1); opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 } }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.promo { position: absolute; inset: 0; z-index: 9; background: rgba(8, 12, 11, .55); }
.promo .opt { position: absolute; width: 12.5%; height: 12.5%; background: var(--bone); border-radius: 50%; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); cursor: pointer; }
.promo .opt i { position: absolute; inset: 6%; background-size: 100%; }
.promo .opt:hover { background: var(--gold-hi); border-radius: 12%; }
.evalbar { position: absolute; left: 0; right: 0; top: -9px; height: 5px; border-radius: 3px; background: #2a2f2e; overflow: hidden; }
.evalbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--bone); transition: width .35s ease; }

/* ---- controls ---- */
.ctl { grid-area: ctl; height: var(--ctl-h); display: flex; align-items: center; gap: 8px; }
.gbtn { flex: 1; min-width: 0; height: 46px; border-radius: 12px; position: relative; display: flex; align-items: center; gap: 10px; padding: 0 14px; container: gbtn / inline-size;
  background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(120deg, var(--gold-lo), var(--gold-hi) 45%, var(--gold) 70%, var(--gold-lo)) border-box;
  border: 1.5px solid transparent; text-align: left; overflow: hidden; }
.gbtn svg { width: 22px; height: 22px; flex: none; }
.gbtn .gl { display: flex; flex-direction: column; min-width: 0; }
.gbtn .t1 { font-weight: 800; font-size: 14px; color: var(--gold); white-space: nowrap; }
.gbtn .t2 { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbtn.armed { background: linear-gradient(115deg, #c9922d, var(--gold-hi) 40%, var(--gold) 60%, #c9922d) border-box; background-size: 220% 100%; animation: sheen 1.8s linear infinite; }
.gbtn.armed .t1, .gbtn.armed .t2 { color: #2a1c03; }
.gbtn.armed svg path { fill: #2a1c03; }
.gbtn.used { background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(var(--line), var(--line)) border-box; }
.gbtn.used .t1 { color: var(--muted); }
.gbtn.used svg path { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.gbtn:disabled { cursor: default; }
@container gbtn (max-width: 150px) { .gbtn svg { display: none; } .gbtn .t2 { display: none; } }
@keyframes sheen { from { background-position: 0% 0 } to { background-position: 220% 0 } }
.navs { display: flex; gap: 2px; flex: none; }
.nbtn { width: 40px; height: 46px; border-radius: 10px; display: grid; place-items: center; color: var(--bone); background: var(--panel); }
.nbtn:hover { background: var(--raise); }
.nbtn:disabled { color: #4d5e5b; cursor: default; background: var(--panel); }
.nbtn svg { width: 18px; height: 18px; }

/* ---- analysis line ---- */
.ana { grid-area: ana; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; min-height: 18px; flex-wrap: wrap; }
.ana b { color: var(--bone); font-weight: 700; }
.ana .gold { color: var(--gold); }

/* ---- game review ---- */
.review { grid-area: review; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side-review { padding: 10px 12px 0; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.rv-progress { position: relative; height: 22px; border-radius: 6px; background: var(--panel); overflow: hidden; font-size: 12px; color: var(--muted); display: flex; align-items: center; padding: 0 8px; }
.rv-progress span { position: relative; z-index: 1; }
.rv-progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--raise); transition: width .2s linear; }
.rv-graph { position: relative; height: 56px; border-radius: 6px; background: #252b2a; overflow: hidden; cursor: pointer; }
.rv-graph svg { width: 100%; height: 100%; }
.rv-graph .area { fill: var(--bone); opacity: .9; }
.rv-graph .mid { stroke: rgba(147, 163, 159, .45); stroke-width: 1; vector-effect: non-scaling-stroke; }
.rv-graph .cur { stroke: var(--hl-sel); stroke-width: 2; vector-effect: non-scaling-stroke; }
.rv-graph .gd { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 1.5px rgba(10, 16, 15, .7); }
.g-mistake { background: #e89a4f; } .g-blunder { background: var(--danger); } .g-gold { background: var(--gold); }
.rv-players { display: flex; flex-direction: column; gap: 4px; }
.rv-p { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 10px; font-size: 13px; min-height: 24px; }
.rv-name { display: flex; align-items: center; gap: 6px; font-weight: 700; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rv-name .pc-ic { width: 18px; height: 18px; background-size: 100%; flex: none; }
.rv-acc b { font-size: 14px; font-variant-numeric: tabular-nums; }
.rv-elo { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rv-counts { display: flex; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 700; }
.cnt em { font-style: normal; font-size: 11px; margin-left: 1px; }
.s-inaccuracy { color: #d9cf6c; } .s-mistake { color: #e89a4f; } .s-blunder { color: #ef7a6c; }
.s-best { color: #8fd0a4; } .s-excellent { color: #8fd0a4; } .s-good { color: #8fc0cf; }
.rv-verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13.5px; }
.v-move { font-weight: 800; } .v-move.gold, .rv-verdict .gold { color: var(--gold); }
.v-cls { font-weight: 700; }
.v-best { color: var(--muted); } .v-best b { color: var(--bone); }
.rv-hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.mv .sym { font-style: normal; font-weight: 800; font-size: 11px; margin-left: 2px; }
.mv .sym.s-inaccuracy { color: #d9cf6c; } .mv .sym.s-mistake { color: #e89a4f; } .mv .sym.s-blunder { color: #ef7a6c; }
.var-tag { color: var(--muted); font-size: 12px; font-weight: 700; padding: 0 4px 0 10px; }
.mv.var { color: #cfe3e8; }
.var-exit { margin-left: 6px; padding: 4px 9px; border-radius: 6px; background: var(--raise); font-size: 12px; font-weight: 700; color: var(--bone); white-space: nowrap; }
.var-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 8px 4px; }
.badge::after { content: ""; position: absolute; right: -6%; top: -6%; width: 34%; height: 34%; border-radius: 50%; display: grid; place-items: center;
  font: 800 calc(var(--bs) * .021)/1 var(--f-ui); color: #10201c; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); z-index: 2; }
.bd-best::after { content: "\2713"; background: #8fd0a4; }
.bd-inaccuracy::after { content: "?!"; background: #d9cf6c; }
.bd-mistake::after { content: "?"; background: #e89a4f; }
.bd-blunder::after { content: "??"; background: #ef7a6c; }

/* ---- scoresheet side panel (wide) ---- */
.side { grid-area: side; display: none; flex-direction: column; min-height: 0; max-height: calc(var(--bs) + 2 * var(--bar-h) + var(--ctl-h) + 18px); background: var(--panel); border-radius: 12px; overflow: hidden; }
.app.wide .side { display: flex; }
.side-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.side-title { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 19px; }
.side-sub { font-size: 12.5px; color: var(--muted); }
.sheet { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 10px; font-weight: 600; font-size: 13.5px; }
.sheet .row { display: grid; grid-template-columns: 38px 1fr 1fr; align-items: center; min-height: 30px; border-bottom: 1px solid rgba(44, 60, 57, .55); }
.sheet .row .n { color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 6px; }
.sheet .mv { justify-self: start; }
.sheet .empty { color: var(--muted); font-weight: 500; padding: 12px 8px; line-height: 1.5; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.side .ana { min-height: 0; }
.side-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.sbtn { height: 34px; padding: 0 12px; border-radius: 9px; background: var(--raise); font-weight: 700; font-size: 13px; }
.sbtn:hover { background: #283836; }
.sbtn:disabled { opacity: .45; cursor: default; }
.sbtn.danger { color: #f0a59b; }

/* ---- overlays ---- */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(5, 9, 8, .62); display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.sheetdlg { width: 100%; max-width: 420px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
@media (max-width: 520px) {
  .veil { align-items: flex-end; padding-bottom: 0; }
  .sheetdlg { border-radius: 18px 18px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 92%; }
}
.dlg-title { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.dlg-title.win { color: var(--gold); }
.dlg-sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-top: -6px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 36px; padding: 0 12px; border-radius: 9px; background: var(--raise); font-weight: 700; font-size: 13.5px; color: var(--bone); }
.seg button[aria-pressed="true"] { background: var(--bone); color: #13201e; }
.seg.tc button { min-width: 58px; font-variant-numeric: tabular-nums; }
.lvl { display: flex; align-items: center; gap: 12px; }
.lvl input[type=range] { flex: 1; accent-color: var(--gold); }
.lvl output { min-width: 120px; font-weight: 700; text-align: right; }
.record { font-size: 12.5px; color: var(--muted); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.primary { flex: 1; min-width: 120px; height: 46px; border-radius: 12px; background: var(--bone); color: #13201e; font-weight: 800; font-size: 15px; }
.primary:hover { background: #fff7e6; }
.secondary { flex: 1; min-width: 100px; height: 46px; border-radius: 12px; background: var(--raise); font-weight: 700; font-size: 14.5px; }
.secondary:hover { background: #283836; }
.secondary.danger { color: #f0a59b; }
.menu-list { display: flex; flex-direction: column; gap: 4px; }
.menu-list button { height: 46px; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-weight: 700; font-size: 14.5px; }
.menu-list button:hover { background: var(--raise); }
.menu-list button:disabled { opacity: .4; cursor: default; background: none; }
.menu-list button svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.menu-list button.danger { color: #f0a59b; }
.rules { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: r; }
.rules li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; line-height: 1.5; font-size: 14px; }
.rules li::before { counter-increment: r; content: counter(r); width: 22px; height: 22px; border-radius: 50%; background: var(--raise); color: var(--gold); font-weight: 800; font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
.howto { font-size: 13.5px; line-height: 1.5; color: var(--muted); background: var(--raise); border-radius: 10px; padding: 10px 12px; }
.howto b { color: var(--gold); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.toggle-row span { font-weight: 700; font-size: 14px; }
.sw { width: 46px; height: 28px; border-radius: 14px; background: var(--raise); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s ease, background .15s ease; }
.sw[aria-checked="true"] { background: var(--gold-lo); }
.sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--gold-hi); }
.pgnbox { width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical; background: var(--ground); color: var(--bone); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 500 12.5px/1.5 var(--f-ui); }
.over-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.over-stats b { color: var(--bone); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 6px); transform: translate(-50%, -8px); z-index: 60; max-width: calc(100% - 48px);
  background: var(--bone); color: #13201e; font-weight: 700; font-size: 13.5px; padding: 10px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.gold { background: var(--gold); color: #2a1c03; }
.credit { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

/* ---- online ---- */
.pname .rt { font-weight: 600; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rt b, .rating-change span { font-weight: 800; }
.up { color: var(--ok); } .down { color: #f0a59b; }
.conn { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.conn.off { background: #5c6b68; box-shadow: 0 0 0 1.5px var(--danger); }
.lvl output small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.dlg-note { font-size: 13px; line-height: 1.5; color: var(--muted); background: var(--raise); border-radius: 10px; padding: 9px 12px; }
.dlg-note.warn { color: #f3c7bf; }
.rating-change { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.rating-change b { font-variant-numeric: tabular-nums; }
.online-fields { display: flex; flex-direction: column; gap: 14px; }
.online-fields[hidden] { display: none; }
.prof { display: flex; flex-direction: column; gap: 6px; min-height: 36px; justify-content: center; }
.prof-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.prof-line b { font-weight: 800; }
.prof-edit { display: flex; gap: 8px; }
.prof-edit input, .linkbox input { flex: 1; min-width: 0; height: 36px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--line); background: var(--ground); color: var(--bone); padding: 0 10px; font: 600 14px var(--f-ui); }
.prof-edit input:focus, .linkbox input:focus { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
.err { color: #f0a59b; font-size: 12.5px; }
.muted { color: var(--muted); }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-weight: 700; font-size: 13px; color: var(--muted); padding: 4px 0; }
.linkbtn:hover { color: var(--bone); }
.linkbtn svg { width: 17px; height: 17px; }
.linkbox { display: flex; gap: 6px; flex-wrap: wrap; }
.linkbox input { flex: 1 1 200px; font-weight: 500; font-size: 13px; }
.seekbar { position: relative; height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.seekbar i { position: absolute; top: 0; bottom: 0; width: 30%; border-radius: 2px; background: var(--bone); animation: seek 1.4s ease-in-out infinite; }
@keyframes seek { 0% { left: -30% } 100% { left: 100% } }
.ana .notice { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ana .notice b { color: var(--bone); }
.notice-btns { display: inline-flex; gap: 8px; flex: none; }
.site-link { display: inline-block; color: var(--bone); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
.ana .sbtn { height: 30px; padding: 0 10px; font-size: 12.5px; }
.sbtn.hot { background: var(--bone); color: #13201e; }
.lb { display: flex; flex-direction: column; max-height: 50vh; overflow-y: auto; }
.lb-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 76px; gap: 8px; align-items: center; min-height: 34px; border-bottom: 1px solid rgba(44, 60, 57, .55); font-size: 13.5px; }
.lb-row.me { background: var(--raise); border-radius: 8px; }
.lb-n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-r { font-weight: 800; font-variant-numeric: tabular-nums; }
.lb-g { color: var(--muted); font-size: 12px; text-align: right; }
@media (prefers-reduced-motion: reduce) { .seekbar i { animation-duration: 3s; } }

@media (max-height: 640px) {
  :root { --top-h: 44px; --bar-h: 42px; --strip-h: 30px; --ctl-h: 50px; }
  .avatar { width: 32px; height: 32px; } .clock { height: 34px; } .gbtn, .nbtn { height: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  .gbtn.armed { animation: none; }
  .fx-ring::before, .fx-spark, .thinking i { animation-duration: .01s; }
}
