<title>Joker Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,600;1,6..96,700&family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: board-first column — player bars hug the board like the two sides of a tournament clock;
   at >=860px wide a scoresheet panel sits to the right.
   Colour: a charcoal ground with lighter surfaces on top; gold is the colour of the one main action on a screen
   (and of the Joker Move); everything else is a quieter grey. */
:root {
  --ground: #2a2f2d;
  --panel: #343a37;
  --raise: #414845;
  --raise-hi: #4b5350;
  --line: #474f4b;
  --bar: #212624;
  --edge: #232826;
  --bone: #f4efe4;
  --muted: #b2bab5;
  --faint: #8d9691;
  --gold: #f0b941;
  --gold-hi: #ffd88a;
  --gold-lo: #a9791f;
  --gold-edge: #b4831f;
  --gold-ink: #2a1d05;
  --brand: #6c9488;
  --brand-hi: #9cc4b6;
  --brand-lo: #3f5a54;
  --brand-edge: #4a6c64;
  --brand-ink: #f4efe4;
  --act: #f0b941;
  --act-ink: #2a1d05;
  --act-edge: #b4831f;
  --danger: #ef7d6e;
  --ok: #93cfa6;
  --sq-light: #e2dccb;
  --sq-dark: #5d7a74;
  --hl-last: rgba(158, 219, 238, .42);
  --hl-sel: rgba(158, 219, 238, .66);
  --hl-pre: rgba(226, 104, 90, .55);
  --hl-pre-to: rgba(226, 104, 90, .34);
  --hl-gold: rgba(240, 185, 65, .66);
  --dot: rgba(10, 20, 18, .26);
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  /* the type: round Fredoka for everything, Lilita One (the name's letters) for titles and the big buttons, Manrope
     for the figures that tick (clocks, codes: Fredoka's figures differ in width) */
  --f-ui: "Fredoka", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-fun: "Lilita One", "Fredoka", system-ui, sans-serif;
  --f-num: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --top-h: 52px;
  --bar-h: 48px;
  --strip-h: 34px;
  --ctl-h: 56px;
  --bs: 352px;
  color-scheme: dark;
}
[data-board="walnut"] { --sq-light: #ecd3a9; --sq-dark: #a97b50; }
[data-board="marble"] { --sq-light: #e7e6e1; --sq-dark: #8d9aa3; }
[data-board="slate"] { --sq-light: #e2dccb; --sq-dark: #5d7a74; }

html, body { height: 100%; background: var(--ground); color: var(--bone); }
body { font-family: var(--f-ui); font-size: 14px; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brand-hi); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 8px;
}

/* ---- shell: one view at a time; tabs at the bottom on phones, a rail on the left on wider screens ---- */
.shell { height: 100%; display: flex; flex-direction: column; }
.views { flex: 1; min-height: 0; min-width: 0; position: relative; }
.view { position: absolute; inset: 0; }
.view.view-in { animation: viewIn .2s ease-out both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .view.view-in { animation: none; } }
/* an app, not a web page: the page itself never bounces; a tab scrolls only when its content is taller than the screen,
   and stops dead at its ends (no rubber band past them); one that (almost) fits doesn't scroll at all (.fits, see app.js) */
html { overscroll-behavior: none; overflow: hidden; }
.page { overflow-y: auto; overscroll-behavior: none; }
.page.fits { overflow-y: hidden; }
.page-in { box-sizing: border-box; width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;
  padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { flex: none; display: flex; background: var(--bar); border-top: 1px solid #3a413e;
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-item { flex: 1; min-width: 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--faint); font-size: 11.5px; font-weight: 700; position: relative; text-decoration: none; }
.nav-item svg { width: 24px; height: 24px; }
.nav-item:hover { color: var(--bone); }
.nav-item[aria-current="page"] { color: var(--bone); }
.tabbar .nav-item[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand-hi); }
.shell[data-view="game"] .tabbar, .shell[data-view="signin"] .tabbar { display: none; }
.rail { display: none; }
.back-btn { margin-left: -8px; }
@media (max-width: 767px) { .top .btn-new { display: none; } }
@media (min-width: 768px) {
  .shell { flex-direction: row; }
  .tabbar, .top .back-btn { display: none; }
  .top .brand { visibility: hidden; } /* the rail carries the name */
  .rail { display: flex; flex-direction: column; gap: 6px; width: 86px; flex: none; box-sizing: border-box; background: var(--bar); border-right: 1px solid #3a413e;
    padding: max(14px, env(safe-area-inset-top, 0px)) 8px 14px max(8px, env(safe-area-inset-left, 0px)); }
  .rail-brand { display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; margin-bottom: 10px; color: var(--bone); text-decoration: none; }
  .rail-brand .logo { width: 30px; height: 30px; flex: none; }
  .rail-brand .wordmark { display: none; }
  .nav-items { display: flex; flex-direction: column; gap: 4px; }
  .rail .nav-item { flex: none; height: 64px; border-radius: 12px; font-size: 11.5px; }
  .rail .nav-item:hover { background: var(--panel); color: var(--bone); }
  .rail .nav-item[aria-current="page"] { background: var(--raise); }
}
@media (min-width: 768px) {
  /* in a game the board takes the whole screen, centred, as on a phone: no rail at the side, the way back and the name
     in the top bar */
  .shell[data-view="game"] .rail { display: none; }
  .shell[data-view="game"] .top .back-btn { display: grid; }
  .shell[data-view="game"] .top .brand { visibility: visible; }
}
@media (min-width: 1240px) {
  .rail { width: 196px; padding-inline: 12px; }
  .rail-brand { justify-content: flex-start; gap: 8px; padding-left: 4px; }
  .rail-brand .wordmark { display: inline-flex; }
  .rail-brand .logo { display: none; } /* wide rail: the name alone, its o is the Joker */
  .rail .nav-item { flex-direction: row; justify-content: flex-start; gap: 14px; height: 48px; padding: 0 14px; font-size: 15px; }
}

/* ---- top bar ---- */
.top { height: var(--top-h); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand .logo, .brand .back-btn svg { width: 26px; height: 26px; }
.wordmark { display: inline-flex; align-items: center; line-height: 0; }
/* the wordmark (app/resources/wordmark.svg): outlines, its o the Joker piece; it wobbles when landed or hovered */
.brand .wordmark .wm, .rail-brand .wordmark .wm, .wordmark .wm { width: auto; height: 30px; display: block; overflow: visible; }
.play-head .brand .wordmark .wm { height: 34px; }
.wm-o { transform-box: view-box; }
@keyframes wmWobble { 0% { transform: rotate(-16deg); } 30% { transform: rotate(11deg); } 55% { transform: rotate(-6deg); } 78% { transform: rotate(3deg); } 100% { transform: rotate(0); } }
@media (hover: hover) { .brand:hover .wm-o, .rail-brand:hover .wm-o { animation: wmWobble 1.1s ease-out; } }
.brand .logo { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3)); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--raise); color: var(--bone); }
.icon-btn svg { width: 20px; height: 20px; }
.btn-new { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--raise); font-weight: 700; font-size: 13.5px; white-space: nowrap; display: flex; align-items: center; }
.btn-new svg { width: 18px; height: 18px; display: none; }
@media (max-width: 400px) { .brand { gap: 8px; } .brand .logo { width: 24px; height: 24px; } .btn-new { padding: 0 11px; } .top-actions { gap: 2px; } }
@media (max-width: 379px) { .btn-new { width: 38px; padding: 0; justify-content: center; } .btn-new span { display: none; } .btn-new svg { display: block; } }
@media (max-width: 360px) {
  .nbtn { width: 34px; } .navs { gap: 2px; } .ctl { gap: 6px; }
  .gbtn { padding: 0 10px; gap: 8px; } .gbtn svg { width: 19px; height: 19px; }
  .clock { min-width: 78px; font-size: 19px; padding: 0 8px; }
}
.btn-new:hover { background: var(--raise-hi); }
/* the tab opened gives one small hop */
.nav-item svg.hop { animation: tabHop .45s ease-out; }
@keyframes tabHop { 0% { transform: translateY(0); } 35% { transform: translateY(-7px) rotate(-6deg); } 70% { transform: translateY(0) rotate(3deg); } 100% { transform: none; } }
/* the search: the Joker hops square to square */
.hopper { position: relative; width: 190px; height: 78px; margin: 6px auto 0; }
.hop-sq { position: absolute; left: 0; bottom: 0; display: flex; border-radius: 8px; overflow: hidden; }
.hop-sq i { display: block; width: 38px; height: 22px; background: #4f776b; } .hop-sq i.d { background: #385a51; }
.hop-pc { position: absolute; left: 5px; bottom: 12px; width: 28px; height: 28px; animation: hopAlong 2.6s ease-in-out infinite; }
.hop-pc svg, .ej-piece svg, .tp-walk svg, .over-joker svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes hopAlong { 0% { transform: translate(0, 0); } 10% { transform: translate(19px, -26px); } 20% { transform: translate(38px, 0); } 30% { transform: translate(57px, -26px); }
  40% { transform: translate(76px, 0); } 50% { transform: translate(95px, -26px); } 60% { transform: translate(114px, 0); } 70% { transform: translate(133px, -26px); } 80%, 100% { transform: translate(152px, 0); } }
/* a win: the Joker drops in over the title and wobbles */
.over-joker { display: block; width: 46px; height: 46px; margin: 0 auto 6px; transform-origin: 50% 92%; }
.over-joker.drop { animation: jkDrop 1.1s ease-out both; }
@keyframes jkDrop { 0% { transform: translateY(-40px); opacity: 0; } 30% { transform: translateY(0); opacity: 1; } 48% { transform: rotate(-12deg); } 66% { transform: rotate(8deg); } 84% { transform: rotate(-3deg); } 100% { transform: none; } }
/* where there is nothing yet */
.empty-joker { display: flex; align-items: center; gap: 14px; padding: 14px 6px; color: var(--bone); font-weight: 500; font-size: 15px; line-height: 1.4; }
.ej-piece { flex: none; width: 46px; height: 46px; }
/* the puzzles: solved so far, the Joker at the one open */
.try-prog { position: relative; height: 6px; border-radius: 3px; background: var(--raise); margin: 22px 0 4px; }
.tp-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--act); transition: width .5s ease; }
.tp-mark { position: absolute; top: -3px; width: 2px; height: 12px; border-radius: 1px; background: #5b6461; }
.tp-walk { position: absolute; bottom: 2px; width: 26px; height: 26px; margin-left: -13px; transition: left .6s cubic-bezier(.5, -0.3, .5, 1.3); }
@media (prefers-reduced-motion: reduce) { .nav-item svg.hop, .hop-pc, .over-joker.drop { animation: none; } .tp-walk, .tp-fill { transition: none; } }

/* ---- stage grid ---- */
.stage { flex: 1; min-height: 0; display: grid; justify-content: center; align-content: center;
  grid-template-columns: var(--bs);
  grid-template-areas: "ptop" "strip" "board" "pbot" "ctl" "ana" "review";
  row-gap: 6px; }
.app.wide .stage { grid-template-columns: var(--bs) minmax(280px, 340px); column-gap: 22px; align-content: center;
  grid-template-areas: "ptop side" "board side" "pbot side" "ctl side"; }
.app.wide .strip { display: none; }
.app.wide .stage > .ana, .app.wide .stage > #review { display: none; }

/* ---- player bars ---- */
.pbar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; min-width: 0; }
.pbar.top-bar { grid-area: ptop; }
.pbar.bottom-bar { grid-area: pbot; }
.avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--raise); flex: none; display: grid; place-items: center; overflow: hidden; }
.avatar.bot { background: none; overflow: visible; border-radius: 10px; }
.avatar.bot svg { width: 100%; height: 100%; display: block; }
.avatar.bot.busy { animation: botthink 1.3s ease-in-out infinite; }
@keyframes botthink { 0%, 100% { box-shadow: 0 0 0 0 rgba(240, 185, 65, 0); } 50% { box-shadow: 0 0 0 3px rgba(240, 185, 65, .75); } }
.avatar .pc-ic { width: 30px; height: 30px; background-size: 100%; }
.pmeta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.pname { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14.5px; white-space: nowrap; min-width: 0; }
.pname .nm { overflow: hidden; text-overflow: ellipsis; }
.gstar { width: 17px; height: 17px; flex: none; }
.gstar .fill { fill: var(--gold); stroke: var(--gold); }
.gstar.used .fill { fill: var(--muted); stroke: var(--muted); opacity: .5; }
.psub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; }
.caps { display: flex; align-items: center; }
.caps i { width: 15px; height: 15px; margin-right: -5px; background-size: 100%; display: inline-block; }
.caps i.gap { margin-left: 6px; }
.adv { margin-left: 8px; font-weight: 700; color: var(--bone); font-size: 12px; }
.thinking { display: inline-flex; gap: 3px; margin-left: 2px; }
.thinking i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }

.clock { flex: none; min-width: 92px; height: 38px; padding: 0 10px; border-radius: 9px; background: var(--panel); color: var(--muted);
  display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
.clock.on { background: var(--bone); color: #1f2422; }
.clock.low { color: var(--danger); }
.clock.on.low { background: #f5d9d4; color: #9b2417; }
.clock.flag { background: var(--danger); color: #fff; }
.clock[hidden] { display: none !important; }

/* ---- move strip (phones) ---- */
.strip { grid-area: strip; height: var(--strip-h); display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-weight: 600; font-size: 13.5px; }
.strip::-webkit-scrollbar { display: none; }
.strip .num { color: var(--muted); padding: 0 2px 0 8px; font-variant-numeric: tabular-nums; }
.strip .num:first-child { padding-left: 2px; }
.mv { padding: 5px 7px; border-radius: 6px; color: var(--bone); }
.mv:hover { background: var(--raise); }
.mv.cur { background: var(--raise); box-shadow: inset 0 -2px 0 var(--muted); }
.mv.gold { color: var(--gold); }
.mv.gold.cur { box-shadow: inset 0 -2px 0 var(--gold); }
.strip .empty { color: var(--muted); font-weight: 500; font-size: 12.5px; padding-left: 2px; overflow: hidden; text-overflow: ellipsis; }

/* ---- board ---- */
.board-wrap { grid-area: board; position: relative; width: var(--bs); height: var(--bs); }
.board { position: absolute; inset: 0; border-radius: 4px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  background: conic-gradient(var(--sq-dark) 0 25%, var(--sq-light) 0 50%, var(--sq-dark) 0 75%, var(--sq-light) 0); background-size: 25% 25%; }
.board .layer { position: absolute; inset: 0; pointer-events: none; }
.sqx { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; }
.hl-last { background: var(--hl-last); }
.hl-sel { background: var(--hl-sel); }
.hl-pre, .hl-pre-from { background: var(--hl-pre); } /* the piece that will move */
.hl-pre-to { background: var(--hl-pre-to); box-shadow: inset 0 0 0 3px var(--hl-pre); } /* the square it goes to */
.hl-pre-gold { background: var(--hl-gold); box-shadow: inset 0 0 0 3px var(--hl-pre); }
.hl-hint { box-shadow: inset 0 0 0 4px var(--act); }
.hl-gold { background: var(--hl-gold); box-shadow: inset 0 0 0 2px rgba(247, 217, 143, .55); }
.hl-check { background: radial-gradient(circle, rgba(255, 70, 50, .95) 0%, rgba(230, 50, 40, .55) 32%, rgba(200, 30, 30, 0) 70%); }
.hl-hover { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .6); }
.hl-hover.g { box-shadow: inset 0 0 0 4px var(--gold-hi); }
.coord { position: absolute; font-size: calc(var(--bs) * .026); font-weight: 800; line-height: 1; }
.coord.rk { left: 3%; top: 4%; }
.coord.fl { right: 4%; bottom: 3%; }
.coord.on-l { color: var(--sq-dark); } .coord.on-d { color: var(--sq-light); }
.dot::after { content: ""; position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; background: var(--dot); }
.ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--bs) * .0095) var(--dot); }
.gdot::after { content: ""; position: absolute; left: 37%; top: 37%; width: 26%; height: 26%; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px rgba(80, 52, 6, .35), 0 0 10px 2px rgba(247, 217, 143, .55); }
.gdot.hot::after { left: 30%; top: 30%; width: 40%; height: 40%; }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 100%; background-repeat: no-repeat; will-change: transform; transform-origin: 50% 50%; }
.pc.lift { z-index: 5; }
.pc.dragging { z-index: 6; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .35)); }
.pc.ghost { opacity: .35; }
.board.armed { box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 26px rgba(240, 185, 65, .45); }
.board.armed .pc.gcan, .board.pz-glow .pc.gcan { filter: drop-shadow(0 0 4px rgba(247, 217, 143, .95)); }
.fx-ring { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; pointer-events: none; z-index: 7; }
.fx-ring::before { content: ""; position: absolute; inset: -10%; border-radius: 50%; border: 3px solid var(--gold-hi); box-shadow: 0 0 18px 4px rgba(247, 217, 143, .7), inset 0 0 12px rgba(247, 217, 143, .6); animation: gring .75s ease-out forwards; }
.fx-spark { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px 2px rgba(247, 217, 143, .9); left: calc(50% - 3.5px); top: calc(50% - 3.5px); animation: gspark .7s ease-out forwards; }
@keyframes gring { 0% { transform: scale(.3); opacity: 1 } 100% { transform: scale(1.9); opacity: 0 } }
@keyframes gspark { 0% { transform: translate(0, 0) scale(1); opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 } }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.promo { position: absolute; inset: 0; z-index: 9; background: rgba(8, 12, 11, .55); }
.promo .opt { position: absolute; width: 12.5%; height: 12.5%; background: var(--bone); border-radius: 50%; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); cursor: pointer; }
.promo .opt i { position: absolute; inset: 6%; background-size: 100%; }
.promo .opt:hover { background: var(--brand-hi); border-radius: 12%; }
.evalbar { position: absolute; left: 0; right: 0; top: -9px; height: 5px; border-radius: 3px; background: #1d211f; overflow: hidden; }
.evalbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--bone); transition: width .35s ease; }

/* ---- controls ---- */
.ctl { grid-area: ctl; height: var(--ctl-h); display: flex; align-items: center; gap: 10px; }
.gbtn { flex: 1; min-width: 0; height: 46px; border-radius: 12px; position: relative; display: flex; align-items: center; gap: 10px; padding: 0 14px; container: gbtn / inline-size;
  background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(120deg, var(--gold-lo), var(--gold-hi) 45%, var(--gold) 70%, var(--gold-lo)) border-box;
  border: 1.5px solid transparent; text-align: left; overflow: hidden; }
.gbtn svg { width: 22px; height: 22px; flex: none; }
.gbtn .gl { display: flex; flex-direction: column; min-width: 0; }
.gbtn .t1 { font-weight: 800; font-size: 14px; color: var(--gold); white-space: nowrap; }
.gbtn .t2 { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbtn.armed { background: linear-gradient(115deg, #c9922d, var(--gold-hi) 40%, var(--gold) 60%, #c9922d) border-box; background-size: 220% 100%; animation: sheen 1.8s linear infinite; }
.gbtn.armed .t1, .gbtn.armed .t2 { color: #2a1c03; }

/* ---- overlays ---- */
/* Frosted glass, the way the phone's own sheets look: the page behind blurs under a dark veil, the sheet itself is
   translucent with a hairline edge. On phones a sheet rises from the bottom edge to edge, with a grabber (drag it down
   to close); dialogs marked .center (the result card, the search) float in the middle on every screen. */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(8, 11, 10, .52); display: flex; align-items: center; justify-content: center;
  -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3); animation: veilIn .22s ease-out both;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.veil.out { animation: veilOut .18s ease-in both; pointer-events: none; }
.sheetdlg { position: relative; width: 100%; max-width: 440px; max-height: calc(100% - 32px); overflow-y: auto; overscroll-behavior: contain;
  background: rgba(62, 69, 66, .74); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, .09); border-radius: 26px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .07); animation: dlgIn .26s cubic-bezier(.2, .9, .3, 1.05) both; }
.veil.out .sheetdlg { animation: dlgOut .18s ease-in both; }
.sheet-handle { display: none; }
@media (max-width: 520px) {
  .veil:not(.center) { align-items: flex-end; padding: env(safe-area-inset-top, 0px) 0 0; }
  .veil:not(.center) .sheetdlg { max-width: none; border-radius: 28px 28px 0 0; border-bottom: 0; padding: 26px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 92%;
    animation: sheetUp .34s cubic-bezier(.22, 1, .36, 1) both; }
  .veil:not(.center).out .sheetdlg { animation: sheetDown .2s ease-in both; }
  .veil:not(.center) .sheetdlg.drag { animation: none; transition: none; }
  .veil:not(.center) .sheetdlg.snap { transition: transform .22s cubic-bezier(.22, 1, .36, 1); }
  /* the grabber: the whole top strip of the sheet drags it down */
  .veil:not(.center) .sheet-handle { display: block; position: sticky; top: -26px; margin: -26px -20px -10px; height: 36px; flex: none; z-index: 2; cursor: grab; touch-action: none; }
  .sheet-handle i { position: absolute; left: 50%; top: 8px; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: rgba(255, 255, 255, .24); }
}
@keyframes veilIn { from { opacity: 0 } to { opacity: 1 } }

@keyframes dlgOut { from { opacity: 1; transform: none } to { opacity: 0; transform: scale(.96) } }
@keyframes sheetUp { from { transform: translateY(60%) } to { transform: none } }

.lobby-reel { position: relative; width: calc(100% + 48px); margin: -6px -24px 4px; height: 86px; overflow: hidden;

<section class="view page" id="view-learn" hidden></section>
<section class="view page" id="view-ratings" hidden></section>
<section class="view page" id="view-profile" hidden></section>
<section class="view page" id="view-signin" hidden></section>
<section class="view page" id="view-games" hidden></section>
<section class="view page" id="view-player" hidden></section>
<div class="view app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <button class="icon-btn back-btn" id="btn-back" data-i18n-aria="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="wordmark"><!--WORDMARK--></span>
    </div>
    <div class="top-actions">
      <button class="btn-new" id="btn-new" data-i18n-aria="newGame" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newGame">New game</span></button>
      <button class="icon-btn" id="btn-rules" data-i18n-aria="rules" aria-label="Rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="btn-settings" data-i18n-aria="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="pbar top-bar" id="bar-top"></div>
    <div class="strip" id="strip" aria-label="Moves"></div>
    <div class="board-wrap" id="board-wrap">
      <div class="evalbar" id="evalbar" hidden><i></i></div>
      <div class="board" id="board" tabindex="0" aria-label="Chess board"></div>
    </div>
    <div class="pbar bottom-bar" id="bar-bot"></div>
    <div class="ctl">
      <button class="gbtn" id="btn-golden">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="var(--gold)" stroke="var(--gold)"><rect x="24" y="90" width="52" height="9" rx="4"/> <rect x="24" y="90" width="52" height="5" rx="3"/> <rect x="30" y="84" width="40" height="8" rx="3"/> <path d="M40 86 L41 70 L59 70 L60 86 Z"/> <path d="M43 86 L44 72 L56 72 L57 86 Z"/> <path d="M31 40 C25 35 25 27 30 25 C34 28 36 34 36 40 Z"/> <path d="M69 40 C75 35 75 27 70 25 C66 28 64 34 64 40 Z"/> <circle cx="50" cy="54" r="27"/> <circle cx="50" cy="56" r="21"/> <ellipse cx="50" cy="66" rx="14" ry="9"/> <path d="M40 67 C44 74 56 74 60 67" stroke-width="2.8" stroke-linecap="round"/> <circle cx="50" cy="60" r="7"/> <ellipse cx="47.4" cy="57.4" rx="2" ry="1.4" /> <ellipse cx="41" cy="49" rx="4.8" ry="5.2"/><ellipse cx="59" cy="49" rx="4.8" ry="5.2"/> <circle cx="41.6" cy="49.6" r="3.2"/><circle cx="59.6" cy="49.6" r="3.2"/> <circle cx="42.8" cy="48.2" r="1.1"/><circle cx="60.8" cy="48.2" r="1.1"/> <path d="M35.5 42.5 C38.5 39.5 43.5 39.5 46 41.5" stroke-width="2.3" stroke-linecap="round"/> <path d="M54 41.5 C56.5 39.5 61.5 39.5 64.5 42.5" stroke-width="2.3" stroke-linecap="round"/> <path d="M34 30 C26 24 14 20 6 24 C14 26 20 30 26 36 Z"/> <path d="M35 34 C45 31 48.5 20 50 2 C51.5 20 55 31 65 34 Z"/> <path d="M66 30 C74 24 86 20 94 24 C86 26 80 30 74 36 Z"/> <path d="M29 35 C40 26 60 26 71 35 L71 39 C60 31 40 31 29 39 Z"/> <circle cx="6" cy="24" r="3.2" stroke-width=".8"/> <circle cx="50" cy="3.5" r="3.2" stroke-width=".8"/> <circle cx="94" cy="24" r="3.2" stroke-width=".8"/></g></svg>
        <span class="gl"><span class="t1" id="g-t1">Joker Move</span><span class="t2" id="g-t2">once per game</span></span>
      </button>
      <div class="navs">
        <button class="nbtn" id="btn-prev" data-i18n-aria="prev" aria-label="Previous move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="nbtn" id="btn-next" data-i18n-aria="next" aria-label="Next move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button class="nbtn" id="btn-menu" data-i18n-aria="menu" aria-label="Game menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
    </div>
    <div class="ana" id="ana"></div>
    <div class="review" id="review" hidden></div>

    <aside class="side" id="side">
      <div class="side-head"><div class="side-title" id="side-title">Joker Chess</div><div class="side-sub" id="side-sub"></div></div>
      <div class="sheet" id="sheet"></div>
      <div class="review side-review" id="review-side" hidden></div>
      <div class="side-foot">
        <div class="ana" id="ana-side"></div>
        <div class="side-actions" id="side-actions"></div>
      </div>
    </aside>
  </main>
</div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="overlay-root"></div>
<div class="intro" id="intro" hidden aria-hidden="true"><div class="intro-scene"><!--INTRO_SCENE--></div><div class="intro-word"><!--WORDMARK--></div></div>
