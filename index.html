.gh-back { margin: -6px 0 2px -4px; }

/* ---- overlays ---- */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(10, 13, 12, .58); display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.sheetdlg { width: 100%; max-width: 440px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel); border-radius: 20px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
@media (max-width: 520px) {
  .veil { align-items: flex-end; padding-bottom: 0; }
  .sheetdlg { border-radius: 22px 22px 0 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 92%; }
}
.dlg-title { font-weight: 800; font-size: 21px; line-height: 1.2; text-wrap: balance; }

  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.gold { background: var(--gold); color: #2a1c03; }
.credit { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.privacy-link { align-self: flex-start; text-decoration: underline; text-underline-offset: 3px; margin-top: -12px; }

/* ---- online ---- */
.pname .rt { font-weight: 600; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rt b, .rating-change span { font-weight: 800; }
.up { color: var(--ok); } .down { color: #f0a59b; }
.conn { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.conn.off { background: #5c6b68; box-shadow: 0 0 0 1.5px var(--danger); }
.lvl output small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.linkbtn.del-acct { align-self: center; margin-top: -12px; padding: 8px 12px; color: #ee8f80; font-weight: 600; }
.linkbtn.del-acct:hover { color: #f6a89c; }
.dlg-note { font-size: 13.5px; line-height: 1.5; color: var(--muted); background: var(--raise); border-radius: 12px; padding: 10px 14px; }
.dlg-note.warn { color: #f3c7bf; }
.rating-change { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.rating-change b { font-variant-numeric: tabular-nums; }
.online-fields { display: flex; flex-direction: column; gap: 14px; }
.online-fields[hidden] { display: none; }
.prof { display: flex; flex-direction: column; gap: 6px; min-height: 36px; justify-content: center; }
.prof-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.prof-line b { font-weight: 800; }
.linkbox input { flex: 1; min-width: 0; height: 42px; box-sizing: border-box; border-radius: 11px; border: 1px solid var(--line); background: #262b29; color: var(--bone); padding: 0 10px; font: 600 14px var(--f-ui); }
.linkbox input:focus { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
.err { color: #f0a59b; font-size: 12.5px; }
.muted { color: var(--muted); }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-weight: 700; font-size: 14px; color: var(--muted); padding: 6px 0; }
.linkbtn.center { align-self: center; }
.linkbtn:hover { color: var(--bone); }
.linkbtn svg { width: 17px; height: 17px; }
.linkbox { display: flex; gap: 6px; flex-wrap: wrap; }
.linkbox input { flex: 1 1 200px; font-weight: 500; font-size: 13px; }
.seekbar { position: relative; height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.seekbar i { position: absolute; top: 0; bottom: 0; width: 30%; border-radius: 2px; background: var(--bone); animation: seek 1.4s ease-in-out infinite; }
@keyframes seek { 0% { left: -30% } 100% { left: 100% } }
.ana .notice { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ana .notice b { color: var(--bone); }
.notice-btns { display: inline-flex; gap: 8px; flex: none; }
.site-link { display: inline-block; color: var(--bone); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
.ana .sbtn { height: 30px; padding: 0 10px; font-size: 12.5px; }
.sbtn.hot { background: var(--gold); color: var(--gold-ink); }
.lb { display: flex; flex-direction: column; max-height: 50vh; overflow-y: auto; }
.lb-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 76px; gap: 8px; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(71, 79, 75, .5); font-size: 14px; }
.lb-row.me { background: var(--raise); border-radius: 8px; }
.lb-n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-r { font-weight: 800; font-variant-numeric: tabular-nums; }
.lb-g { color: var(--muted); font-size: 12px; text-align: right; }
@media (prefers-reduced-motion: reduce) { .seekbar i { animation-duration: 3s; } }

/* ---- account ---- */
.acct-form { display: flex; flex-direction: column; gap: 10px; }
.gsi-box { flex: 1; min-width: 0; min-height: 44px; display: flex; justify-content: center; align-items: center; color-scheme: normal; }
.acct-input { width: 100%; height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--line); background: #262b29; color: var(--bone); padding: 0 14px; font: 600 16px var(--f-ui); }
.acct-input:focus { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
.acct-input:disabled { opacity: .6; }
.acct-input.code { height: 58px; font-size: 26px; font-weight: 800; letter-spacing: .3em; text-indent: .3em; text-align: center; font-variant-numeric: tabular-nums; }

.acct-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.acct-or::before, .acct-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.acct-line { font-size: 13px; flex-wrap: nowrap; justify-content: space-between; }
.acct-line span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; line-height: 1.4; }
.acct-line .sbtn, .acct-line .linkbtn { flex: none; align-self: center; }
.acct-email { font-weight: 700; }
.acct-nudge { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.acct-nudge .linkbtn { color: var(--bone); text-decoration: underline; text-underline-offset: 3px; }
.acct-input.code::placeholder { color: var(--muted); opacity: .45; }

@media (max-height: 640px) {
  :root { --top-h: 44px; --bar-h: 42px; --strip-h: 30px; --ctl-h: 50px; }
  .avatar { width: 32px; height: 32px; } .clock { height: 34px; } .gbtn, .nbtn { height: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  .gbtn.armed { animation: none; }
  .fx-ring::before, .fx-spark, .thinking i { animation-duration: .01s; }
}
/* ---- pages: shared ---- */
.page-h { font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
.card { background: var(--panel); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card > h2 { font-size: 15px; font-weight: 800; margin: 0; }
.mini-board { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 6px; box-shadow: 0 10px 28px rgba(0, 0, 0, .35); }
.mini-board .board { border-radius: 6px; }
.mini-board.demo .board { pointer-events: none; touch-action: pan-y; }
.mini-board.demo { cursor: pointer; }
.xmark::after { content: ""; position: absolute; inset: 31%;
  background: linear-gradient(45deg, transparent 41%, rgba(206, 66, 52, .9) 41% 59%, transparent 59%), linear-gradient(-45deg, transparent 41%, rgba(206, 66, 52, .9) 41% 59%, transparent 59%); }

/* ---- play ---- */
.play-wrap { min-height: 100%; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; gap: 48px;
  padding-block: 18px 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.play-board { display: none; flex: none; }
.play-col { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }
.play-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-bottom: 4vh; }
@media (max-width: 767px) { .play-wrap { align-items: stretch; } }
.play-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; }
.play-head .brand svg { width: 28px; height: 28px; }
.acct-chip { height: 40px; max-width: 58%; padding: 0 14px 0 6px; border-radius: 20px; background: var(--raise); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.acct-chip:hover { background: var(--raise-hi); }
.acct-chip .av { width: 28px; height: 28px; border-radius: 50%; background: var(--bone); color: #1f2422; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.acct-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-chip.out { padding: 0 16px; }
.play-mark { align-self: center; position: relative; width: 120px; height: 120px; margin: 6px 0 2px; }
.play-mark .ring { position: absolute; inset: 8px; border-radius: 50%; background: radial-gradient(circle, #3d4542 0%, #2f3533 70%); box-shadow: 0 0 0 2px rgba(240, 185, 65, .75), 0 0 40px rgba(240, 185, 65, .22); }
.play-mark .pc-ic { position: absolute; inset: 22px; background-size: 100%; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); }
.play-mark .sp { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px 2px rgba(255, 216, 138, .7); }
.play-mark .st { position: absolute; right: 8px; top: 6px; width: 26px; height: 26px; }
.play-actions { display: flex; flex-direction: column; gap: 16px; }
.tc-field { width: 100%; height: 58px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; text-align: left; }
.tc-field:hover { background: #3a413e; }
.tc-field .tc-ic svg { width: 22px; height: 22px; }
.tc-field .tc-l { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.tc-field .pool { font-size: 14px; font-weight: 700; color: var(--muted); }
.tc-field .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tc-field .tag { font-size: 12.5px; font-weight: 700; color: var(--muted); background: var(--raise); padding: 4px 9px; border-radius: 8px; }
.tc-field .chev { width: 20px; height: 20px; color: var(--muted); flex: none; }
.tc-group { display: flex; flex-direction: column; gap: 10px; }
.tc-group-h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
.tc-group-h svg { width: 17px; height: 17px; }
.tc-group-h .r { margin-left: auto; font-variant-numeric: tabular-nums; }
.tc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tc-opt { height: 50px; border-radius: 13px; background: var(--raise); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.tc-opt:hover { background: var(--raise-hi); }
.tc-opt[aria-pressed="true"] { background: var(--bone); color: #1f2422; }
.tc-sep { display: inline-block; position: relative; width: 2px; height: .82em; margin: 0 .42em; vertical-align: -.06em; border-radius: 1px; background: currentColor; opacity: .5; }
.tc-sep b { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic-bullet { color: #e3d773; } .ic-blitz { color: var(--gold); } .ic-rapid { color: var(--ok); }
/* the one main action on a screen */
.start-btn { width: 100%; height: 62px; border-radius: 16px; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 20px; box-shadow: 0 4px 0 var(--gold-edge); }
.start-btn:hover { background: #f5c45c; }
.start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-edge); }
.start-btn:disabled { opacity: .6; cursor: default; }
/* the second, quieter action */
.second-btn { width: 100%; height: 56px; border-radius: 16px; background: var(--raise); color: var(--bone); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--edge); }
.second-btn:hover { background: var(--raise-hi); }
.second-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--edge); }
.play-meta { text-align: center; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.home-foot { align-self: center; margin-top: auto; padding: 6px 4px; font-size: 12.5px; color: var(--muted); opacity: .8; text-decoration: none; }
.home-foot:hover { color: var(--bone); text-decoration: underline; text-underline-offset: 3px; }
.opt-btn { width: 100%; min-height: 76px; border-radius: 16px; background: var(--raise); color: var(--bone); display: flex; align-items: center; gap: 14px; padding: 12px 16px; box-sizing: border-box; text-align: left; box-shadow: 0 3px 0 var(--edge); }
.opt-btn:hover { background: var(--raise-hi); }
.opt-btn.main { background: var(--gold); color: var(--gold-ink); box-shadow: 0 3px 0 var(--gold-edge); }
.opt-btn.main:hover { background: #f5c45c; }
.opt-btn:active { transform: translateY(2px); }
.opt-btn .ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center; }
.opt-btn .ic svg { width: 32px; height: 32px; }
.opt-btn .lbl { min-width: 0; display: flex; flex-direction: column; gap: 3px; font-weight: 800; font-size: 17px; }
.opt-btn .sub { font-weight: 600; font-size: 13px; opacity: .78; line-height: 1.35; }
.resume { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px; background: var(--panel); border: 1.5px solid rgba(240, 185, 65, .55); }
.resume .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.resume .t b { font-size: 15px; }
.resume .t span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume .sbtn { flex: none; }
.resume .av-s { width: 42px; height: 42px; flex: none; }
.resume .av-s svg { width: 100%; height: 100%; display: block; }
.offline-note { font-size: 13.5px; color: var(--muted); text-align: center; line-height: 1.5; }
.offline-note.app-off { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.offline-note.app-off .linkbtn { align-self: center; color: var(--bone); text-decoration: underline; text-underline-offset: 3px; }
/* the iPhone / Android app: text isn't selectable outside fields, like in a native app */
html.native body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html.native input, html.native textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
/* the app runs edge to edge: the tab bar reaches the bottom of the screen and keeps its own icons above the home
   indicator; screens without the tab bar stop above it */
html.native:root { padding-bottom: 0; }
html.native .views { margin-bottom: env(safe-area-inset-bottom, 0px); }
@media (max-width: 767px) {
  html.native .shell:not([data-view="game"]):not([data-view="signin"]) .views { margin-bottom: 0; }
}
@media (min-width: 768px) { .play-wrap { align-items: center; } .play-head .brand { visibility: hidden; } }
@media (min-width: 1100px) {
  .play-board { display: block; width: min(560px, calc(100vh - 96px)); }
}
/* full-width buttons in column layouts (in a row of buttons they share the row) */
.acct-form > .primary, .my-card > .primary, .signin-card > .primary { flex: none; width: 100%; }
.rule-card .mini-board { max-width: 320px; align-self: center; }

/* ---- bots ---- */
.bots-page { gap: 18px; padding-bottom: 0; }
.bot-hero-wrap { position: sticky; top: 0; z-index: 3; margin: -8px 0 -6px; padding: 8px 0 6px; background: var(--ground); }
.bot-hero { background: var(--panel); border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.bot-face { width: 84px; height: 84px; }
.bot-face svg, .bot-tile .face svg { width: 100%; height: 100%; display: block; }
.bot-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bot-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bot-name b { font-size: 25px; font-weight: 800; letter-spacing: -.01em; }
.bot-name .elo { font-size: 15px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.bot-lv { font-size: 14px; font-weight: 700; color: var(--gold); }
.bot-bio { grid-column: 1 / -1; margin: 0; font-size: 14.5px; line-height: 1.5; color: #e2dccf; }
.bot-foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -2px; }
.bot-rec { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
.color-pick { display: flex; gap: 6px; flex: none; }
.color-pick button { width: 44px; height: 44px; border-radius: 12px; background: var(--raise); display: grid; place-items: center; }
.color-pick button:hover { background: var(--raise-hi); }
.color-pick button .pc-ic { width: 32px; height: 32px; background-size: 100%; display: block; }
.color-pick button svg { width: 26px; height: 26px; }
.color-pick button[aria-pressed="true"] { background: var(--raise-hi); box-shadow: inset 0 0 0 2.5px var(--gold); }
.bot-group { margin: 4px 0 -6px; font-size: 15px; font-weight: 800; color: var(--muted); }
.bot-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 12px; }
.bot-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bot-tile .face { display: block; width: 100%; aspect-ratio: 1; border-radius: 22%; transition: transform .12s ease, box-shadow .12s ease; }
.bot-tile:hover .face { transform: translateY(-2px); }
.bot-tile:active .face { transform: scale(.96); }
.bot-tile[aria-pressed="true"] .face { box-shadow: 0 0 0 3px var(--ground), 0 0 0 6px var(--gold); }
.bot-tile .nm { font-size: 14px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bot-tile .el { margin-top: -5px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.bot-tile[aria-pressed="true"] .nm { color: var(--gold); }
.bot-color { gap: 10px; }
.bot-color .seg button { flex: 1; }
.cta-bar { position: sticky; bottom: 0; z-index: 3; margin-top: 2px; padding: 16px 0 calc(18px + env(safe-area-inset-bottom, 0px) * 0); background: linear-gradient(rgba(42, 47, 45, 0), var(--ground) 30%); }
@media (min-width: 768px) { .bot-grid { gap: 18px 16px; } }

/* ---- sign in ---- */
.signin { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  padding-block: 8px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.signin-top { height: 48px; display: flex; align-items: center; }
.signin-back { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 12px 0 4px; border-radius: 10px; color: var(--muted); font-weight: 700; }
.signin-back:hover { color: var(--bone); background: var(--panel); }
.signin-back svg { width: 20px; height: 20px; }
.signin-main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: clamp(8px, 6vh, 64px); }
.signin-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
.signin-card .mark { width: 48px; height: 48px; }
.signin-card .dlg-title { font-size: 30px; }
.signin-alt { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
.signin-alt .linkbtn { display: inline; padding: 0; color: var(--bone); text-decoration: underline; text-underline-offset: 3px; }
@media (min-width: 768px) {
  .signin-main { align-items: center; padding-top: 0; padding-bottom: 6vh; }
  .signin-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
}

/* ---- ratings ---- */
.my-card { flex-direction: row; align-items: center; gap: 16px; }
.my-card .big { font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.my-card .meta { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.my-card .meta b { color: var(--bone); font-size: 15px; }
.my-card.out { flex-direction: column; align-items: stretch; }
.lb-card { padding: 6px 10px; }
.lb-card .lb { max-height: none; }
.lb-row:last-child { border-bottom: 0; }

/* ---- profile ---- */
.prof-hero { display: flex; align-items: center; gap: 16px; }
.avatar-lg { width: 68px; height: 68px; border-radius: 50%; background: var(--raise); display: grid; place-items: center; flex: none;
  font-weight: 800; font-size: 30px; }
.avatar-lg.reg { box-shadow: 0 0 0 3px var(--gold); }
.prof-who { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.prof-name { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; overflow-wrap: anywhere; }
.prof-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.name-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; height: 38px; margin-top: 6px; padding: 0 14px 0 12px; }
.name-btn svg { width: 17px; height: 17px; flex: none; }
.pool-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pool-card { background: var(--panel); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pool-card .h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.pool-card .h svg { width: 14px; height: 14px; }
.pool-card .r { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pool-card .g { font-size: 12px; color: var(--muted); }
.card .toggle-row + .toggle-row { margin-top: -6px; }

/* ---- learn ---- */
.learn { max-width: 780px; gap: 34px; }
.learn h1 { font-weight: 800; font-size: clamp(28px, 6.6vw, 40px); line-height: 1.12; letter-spacing: -.015em; margin: 4px 0 0; text-wrap: balance; }
.learn h2 { font-weight: 800; font-size: 22px; line-height: 1.2; margin: 0; }
.learn p { margin: 0; line-height: 1.55; }
.learn .lead { font-size: 16px; color: #e2dccf; max-width: 60ch; }
.learn section { display: flex; flex-direction: column; gap: 14px; }
.learn-hero { display: grid; gap: 16px; align-items: center; }
.demo-box { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.demo-box .mini-board { max-width: 420px; }
.demo-cap { min-height: 3.1em; font-size: 14px; line-height: 1.55; color: var(--muted); }
.demo-cap b { color: var(--gold); font-weight: 800; }
@media (min-width: 900px) { .learn-hero { grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; } }
.rule-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 620px) { .rule-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.rule-card { gap: 12px; padding: 14px; }
.rule-card h3 { margin: 0; font-size: 16px; font-weight: 800; }
.rule-card p { font-size: 13.5px; color: var(--muted); }
.stars-art { width: 100%; aspect-ratio: 1; border-radius: 10px; background: var(--raise); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 18px; box-sizing: border-box; }
.stars-art .row { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 15px; }
.stars-art .row svg { width: 34px; height: 34px; flex: none; }
.stars-art .row small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
@media (max-width: 619px) { .stars-art { aspect-ratio: auto; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 14px 28px; padding: 22px 18px; } }
.usp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.usp { background: var(--panel); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.usp b { font-weight: 800; font-size: 30px; line-height: 1; color: var(--gold); }
.usp span { font-size: 13px; color: var(--muted); line-height: 1.45; }
.vs960 { border-left: 3px solid var(--gold); padding: 4px 0 4px 14px; color: #e2dccf; font-size: 15px; }
.try-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.try-tabs { display: flex; gap: 6px; }
.try-tab { height: 40px; min-width: 44px; padding: 0 12px; border-radius: 11px; background: var(--raise); font-weight: 800; font-variant-numeric: tabular-nums; }
.try-tab[aria-pressed="true"] { background: var(--bone); color: #1f2422; }
.try-tab.done { box-shadow: inset 0 -3px 0 var(--ok); }
.try-body { display: grid; gap: 14px; align-items: start; }
@media (min-width: 760px) { .try-body { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; } }
.try-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.try-prompt { font-size: 15.5px; line-height: 1.5; font-weight: 600; }
.try-status { font-size: 14px; line-height: 1.5; min-height: 1.5em; color: var(--muted); }
.try-status.good { color: var(--ok); } .try-status.bad { color: #f0a59b; }
.try-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.try-actions .sbtn { height: 44px; padding: 0 18px; }
.try-actions .sbtn.hot { background: var(--gold); color: var(--gold-ink); }
.rules-full .rules li { font-size: 14.5px; }
.learn-cta { align-self: flex-start; width: auto; padding: 0 34px; }
@media (prefers-reduced-motion: reduce) { .start-btn:active { transform: none; } }

  // ------------------------------------------------------------------ game model
  function Game(cfg, startFen) {
    this.cfg = cfg;
    this.startFen = startFen || GC.START_FEN;
    this.pos = new GC.Position(this.startFen);
    this.records = [];
    this.fens = [this.pos.fen()];
    this.rep = {}; this.rep[this.pos.hashKey()] = 1;
    this.clock = cfg.tc ? { t: [cfg.tc.base, cfg.tc.base], since: perf() } : null;
    this.status = 'playing'; this.result = null; this.reason = null;
    this.legal = this.pos.legalMoves(true);

  Game.prototype.running = function () { return !!this.clock && this.status === 'playing' && this.records.length >= 2 && !this.paused; };
  Game.prototype.timeLeft = function (color, now) {
    if (!this.clock) return Infinity;
    var t = this.clock.t[color];
    if (this.running() && this.pos.side === color) t -= (now - this.clock.since);
    return t;
  };
  Game.prototype.freeze = function (now) {
    if (this.running()) { var c = this.pos.side; this.clock.t[c] = Math.max(0, this.clock.t[c] - (now - this.clock.since)); this.clock.since = now; }
  };
  Game.prototype.end = function (result, reason, now) {
    if (this.status !== 'playing') return;
    this.freeze(now == null ? perf() : now);

  };
  Game.prototype.flag = function (color, now) {

    else this.end(color === 0 ? '0-1' : '1-0', 'timeout', now);
  };
  Game.prototype.checkFlag = function (now) {

    return false;

  // Apply a legal move. Returns the record, or null if the mover's flag had already fallen.
  Game.prototype.play = function (m, now) {

    if (this.running()) {
      var left = this.clock.t[us] - (now - this.clock.since);
      if (left <= 0 && !this.online) { this.flag(us, now); return null; }
      this.clock.t[us] = Math.max(0, left) + this.cfg.tc.inc;
    }
    var moving = this.pos.board[m & 127];
    var san = this.pos.san(m, this.legal);

    var k = this.pos.hashKey(); this.rep[k] = (this.rep[k] || 0) + 1;
    if (this.clock) this.clock.since = now;
    this.legal = this.pos.legalMoves(true);
    if (!this.legal.length) {
      if (this.pos.inCheck()) this.end(us === 0 ? '1-0' : '0-1', 'checkmate', now);
      else this.end('1/2-1/2', 'stalemate', now);
    } else if (this.rep[k] >= 3) this.end('1/2-1/2', 'repetition', now);
    else if (this.pos.halfmove >= 100) this.end('1/2-1/2', 'fifty', now);

        g.play(m, now);

  }
  function histFromLocal(r) {

      tc: r.tc && r.tc !== 'none' ? r.tc : null, golden: usedGolden(r.moves, c, ss), n: r.moves.length, local: r };
  }
  function histMerge() {
    var uid = hist.uid || (me && me.uid), items = hist.online.map(function (g) { return histFromOnline(g, uid); }).concat(load('history', []).map(histFromLocal));

  }
  function loadHistory(more) {
    if (hist.loading) return;
    hist.at = Date.now();
    if (!NETCFG || !(me || hasNetSession())) { hist.online = []; hist.more = false; hist.h2h = null; histMerge(); renderHistViews(); return; }
    hist.loading = true; hist.err = false;

      var before = more && hist.online.length ? hist.online[hist.online.length - 1].updated_at : null;
      return Promise.all([
        net.history(me.uid, before).then(function (rows) {

        }),
        more ? null : net.h2h(me.uid).then(function (rows) { hist.h2h = rows; }, function () { hist.h2h = null; })

  // all the games against one opponent (not only those among the latest), a page at a time

    var before = more && o.rows.length ? o.rows[o.rows.length - 1].updated_at : null;
    net.history(me.uid, before, id).then(function (rows) {
      o.rows = (more ? o.rows : []).concat(rows); o.more = rows.length === HIST_PAGE;
    }, function () { /* the games among the latest still show */ }).then(function () { o.loading = false; if (hist.opp === o && curView === 'games') renderGames(); });
  }
  function renderHistViews() { if (curView === 'games') renderGames(); else if (curView === 'profile') renderProfile(); }

  }
  function dayText(t) {
    var d = new Date(t), now = new Date(), y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    var hm = d.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });

  function histRow(it, sums) {

      esc(it.opp.name) + '</b>' + (it.opp.rating ? '<em>' + it.opp.rating + '</em>' : '') + (it.golden ? '<i class="gh-gold" title="' + esc(T('golden')) + '">✦</i>' : '') + '</span><span class="gh-sub">' + sub.join('<i class="gh-dot"></i>') + '</span></span>' + right + '</button>';
  }
  function renderGames() {
    var host = $('view-games');
    host.innerHTML = '';
    var inn = h('div', { class: 'page-in' }); host.appendChild(inn);
    var back = h('button', { type: 'button', class: 'signin-back gh-back', id: 'games-back' }, BACK_SVG + '<span>' + esc(T('navProfile')) + '</span>');
    back.addEventListener('click', function () { go('profile'); });
    inn.appendChild(back);
    inn.appendChild(h('h1', { class: 'page-h' }, esc(T('games'))));
    if (!hist.items) { inn.appendChild(h('div', { class: 'muted' }, esc(T('connecting')) + '…')); return; }
    var items = hist.items, opps = h2hOf(items), sums = load('reviewSums', {});
    if (opps.length) {
      var chips = '<button type="button" class="gh-chip' + (hist.filter ? '' : ' on') + '" data-opp="">' + esc(T('allOpponents')) + '</button>';
      opps.slice(0, 12).forEach(function (o) {
        chips += '<button type="button" class="gh-chip' + (hist.filter === o.id ? ' on' : '') + '" data-opp="' + esc(o.id) + '"><b>' + esc(o.name) + '</b><span>' + o.w + ':' + o.l + '</span></button>';
      });
      inn.appendChild(h('div', { class: 'gh-chips', id: 'gh-chips' }, chips));
    }
    var oppMore = false;
    if (hist.filter) {
      var o = opps.filter(function (x) { return x.id === hist.filter; })[0], seen = {};
      items = items.filter(function (it) { return it.opp.id === hist.filter; });
      if (hist.opp && hist.opp.id === hist.filter) {
        items.forEach(function (it) { seen[it.key] = 1; });
        hist.opp.rows.forEach(function (g) { var it = histFromOnline(g, hist.uid || me.uid); if (!seen[it.key]) { seen[it.key] = 1; items.push(it); } });
        items.sort(function (a, b) { return b.at - a.at; });
        oppMore = hist.opp.more;

      if (o) inn.appendChild(h('div', { class: 'gh-score', id: 'gh-score' }, '<div class="gh-score-n"><span class="me">' + esc(T('you')) + '</span><b>' + o.w + ' : ' + o.l + '</b><span>' + esc(o.name) + '</span></div><em>' + esc(T('h2hDraws', { d: o.d })) + ' · ' + esc(T('gamesN', { n: o.n })) + '</em>'));
    }

    if (!items.length) inn.appendChild(h('div', { class: 'muted gh-empty' }, esc(hist.loading ? T('connecting') + '…' : T('noGames'))));
    if (hist.err) inn.appendChild(h('div', { class: 'err' }, esc(T('netError'))));

      var more = h('button', { type: 'button', class: 'secondary gh-more', id: 'btn-more-games' }, esc(T('showMore')));

  }
  // Profile: the last few games and the way to all of them

  // open a past game on the board, with its review

  // back from a past game: the game saved on this device (or a fresh board)

  }

  // ---- Learn

    var k = kit();

    k.render($('view-learn'));
    k.active(curView);
  }

  function bootOnline() {
    if (!NETCFG) return;

        else if (note === 'deleted') toast(T('deletedToast'));
