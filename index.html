<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,600;1,6..96,700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: board-first column — player bars hug the board like the two sides of a tournament clock;
   at >=860px wide a scoresheet panel sits to the right. Gold is reserved for the golden move only. */
:root {
  --ground: #0f1716;
  --panel: #162120;
  --raise: #1f2c2a;
  --line: #2c3c39;
  --bone: #ece6d8;
  --muted: #93a39f;
  --gold: #e7b44a;
  --gold-hi: #f7d98f;
  --gold-lo: #9c6f1c;
  --danger: #e2685a;
  --ok: #8fc7a0;
  --sq-light: #e2dccb;
  --sq-dark: #5d7a74;
  --hl-last: rgba(158, 219, 238, .42);
  --hl-sel: rgba(158, 219, 238, .66);
  --hl-pre: rgba(226, 104, 90, .55);
  --hl-gold: rgba(231, 180, 74, .66);
  --dot: rgba(10, 20, 18, .26);
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --f-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --top-h: 52px;
  --bar-h: 48px;
  --strip-h: 34px;
  --ctl-h: 56px;
  --bs: 352px;
  color-scheme: dark;
}
.app[data-board="walnut"] { --sq-light: #ecd3a9; --sq-dark: #a97b50; }
.app[data-board="marble"] { --sq-light: #e7e6e1; --sq-dark: #8d9aa3; }
.app[data-board="slate"] { --sq-light: #e2dccb; --sq-dark: #5d7a74; }

html, body { height: 100%; background: var(--ground); color: var(--bone); }
body { font-family: var(--f-ui); font-size: 14px; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 8px;
}

/* ---- top bar ---- */
.top { height: var(--top-h); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 26px; height: 26px; flex: none; }
.wordmark { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 22px; letter-spacing: .2px; white-space: nowrap; }
.wordmark b { color: var(--gold); font-weight: 700; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--raise); color: var(--bone); }
.icon-btn svg { width: 20px; height: 20px; }
.btn-new { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--raise); font-weight: 700; font-size: 13.5px; white-space: nowrap; display: flex; align-items: center; }
.btn-new svg { width: 18px; height: 18px; display: none; }
@media (max-width: 400px) { .wordmark { font-size: 20px; } .brand { gap: 8px; } .brand svg { width: 24px; height: 24px; } .btn-new { padding: 0 11px; } .top-actions { gap: 2px; } }
@media (max-width: 379px) { .btn-new { width: 38px; padding: 0; justify-content: center; } .btn-new span { display: none; } .btn-new svg { display: block; } }
@media (max-width: 360px) {
  .nbtn { width: 34px; } .navs { gap: 2px; } .ctl { gap: 6px; }
  .gbtn { padding: 0 10px; gap: 8px; } .gbtn svg { width: 19px; height: 19px; }
  .clock { min-width: 78px; font-size: 19px; padding: 0 8px; }
  .wordmark { font-size: 19px; }
}
.btn-new:hover { background: #283836; }

/* ---- stage grid ---- */
.stage { flex: 1; min-height: 0; display: grid; justify-content: center; align-content: center;
  grid-template-columns: var(--bs);
  grid-template-areas: "ptop" "strip" "board" "pbot" "ctl" "ana" "review";
  row-gap: 6px; }
.app.wide .stage { grid-template-columns: var(--bs) minmax(280px, 340px); column-gap: 22px; align-content: center;
  grid-template-areas: "ptop side" "board side" "pbot side" "ctl side"; }
.app.wide .strip { display: none; }
.app.wide .stage > .ana, .app.wide .stage > #review { display: none; }

/* ---- player bars ---- */
.pbar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; min-width: 0; }
.pbar.top-bar { grid-area: ptop; }
.pbar.bottom-bar { grid-area: pbot; }
.avatar { width: 36px; height: 36px; border-radius: 9px; background: var(--raise); flex: none; display: grid; place-items: center; overflow: hidden; }
.avatar .pc-ic { width: 30px; height: 30px; background-size: 100%; }
.pmeta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.pname { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14.5px; white-space: nowrap; min-width: 0; }
.pname .nm { overflow: hidden; text-overflow: ellipsis; }
.gstar { width: 15px; height: 15px; flex: none; }
.gstar .fill { fill: var(--gold); }
.gstar.used .fill { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .7; }
.psub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; }
.caps { display: flex; align-items: center; }
.caps i { width: 15px; height: 15px; margin-right: -5px; background-size: 100%; display: inline-block; }
.caps i.gap { margin-left: 6px; }
.adv { margin-left: 8px; font-weight: 700; color: var(--bone); font-size: 12px; }
.thinking { display: inline-flex; gap: 3px; margin-left: 2px; }
.thinking i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }

.clock { flex: none; min-width: 92px; height: 38px; padding: 0 10px; border-radius: 8px; background: var(--panel); color: var(--muted);
  display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
.clock.on { background: var(--bone); color: #13201e; }
.clock.low { color: var(--danger); }
.clock.on.low { background: #f5d9d4; color: #9b2417; }
.clock.flag { background: var(--danger); color: #fff; }
.clock[hidden] { display: none !important; }

/* ---- move strip (phones) ---- */
.strip { grid-area: strip; height: var(--strip-h); display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-weight: 600; font-size: 13.5px; }
.strip::-webkit-scrollbar { display: none; }
.strip .num { color: var(--muted); padding: 0 2px 0 8px; font-variant-numeric: tabular-nums; }
.strip .num:first-child { padding-left: 2px; }
.mv { padding: 5px 7px; border-radius: 6px; color: var(--bone); }
.mv:hover { background: var(--raise); }
.mv.cur { background: var(--raise); box-shadow: inset 0 -2px 0 var(--muted); }
.mv.gold { color: var(--gold); }
.mv.gold.cur { box-shadow: inset 0 -2px 0 var(--gold); }
.strip .empty { color: var(--muted); font-weight: 500; font-size: 12.5px; padding-left: 2px; overflow: hidden; text-overflow: ellipsis; }

/* ---- board ---- */
.board-wrap { grid-area: board; position: relative; width: var(--bs); height: var(--bs); }
.board { position: absolute; inset: 0; border-radius: 4px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  background: conic-gradient(var(--sq-dark) 0 25%, var(--sq-light) 0 50%, var(--sq-dark) 0 75%, var(--sq-light) 0); background-size: 25% 25%; }
.board .layer { position: absolute; inset: 0; pointer-events: none; }

    });
  }
  function rematchState() {

    if (s.rematch_offer === mine) return { label: T('rematchSent'), disabled: true };

  }
  function rematch() { onlineAction('rematch').then(function () { renderSide(); }); }
  function firstMoveSince(s) { return s.moves.length === 0 ? Date.parse(s.created_at) : Date.parse(s.updated_at); }

    var o = online;

      function () { o.claimBusy = false; o.claimNext = perf() + 3000; });
  }
  function onlineTick(now) {

    if (game.records.length < 2) {

  }
  function onlineNotice() {

      if (mine && s.draw_offer && s.draw_offer !== mine) {
        out += '<span class="notice"><b>' + esc(T('oppOffersDraw', { name: sideLabel(o.color ^ 1) })) + '</b>' +
          '<button class="sbtn" data-act="draw-accept">' + esc(T('accept')) + '</button><button class="sbtn" data-act="draw-decline">' + esc(T('decline')) + '</button></span>';
      } else if (mine && s.draw_offer === mine) out += '<span>' + esc(T('drawOffered')) + '</span>';
      if (game.records.length < 2 && o.firstSec >= 0) {
        var side = game.pos.side, who = mine && (side === 0 ? 'w' : 'b') === mine ? T('you') : sideLabel(side);
        out += '<span>' + esc(T('firstMove', { side: who, s: o.firstSec })) + '</span>';
      }
      if (!o.connected && perf() - o.lastEvent > 4000) out += '<span class="muted">' + esc(T('reconnecting')) + '</span>';
    } else if (mine && s.rematch_offer && s.rematch_offer !== mine && !s.rematch_game) {
      out += '<span class="notice"><b>' + esc(T('oppWantsRematch', { name: sideLabel(o.color ^ 1) })) + '</b><button class="sbtn" data-act="rematch">' + esc(T('acceptRematch')) + '</button></span>';
    }

  }
  setInterval(function () {
    var o = online;
    if (!o || !o.s || !net) return;
    var idle = perf() - o.lastEvent, playing = o.s.status === 'playing';

  }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && online) resyncOnline(); });
  function bootOnline() {
    if (!NETCFG) return;

    if (join) { joinGame(join); return; }
    if (gid) { openOnlineGame(gid); return; }
    if ((saved && saved.id) || hasNetSession()) {

        else if (saved && saved.id) save('online', null);
      }, function () { /* offline: stay with the local game */ });
    }
  }

  // ------------------------------------------------------------------ boot
  function boot(hotData) {
    applySettings(); applyLang(); layout();
    var saved = (hotData && hotData.game) || load('game', null), g = saved ? Game.restore(saved) : null;
    if (g) {
      game = g; view = game.records.length;
      orient = botGame() ? game.cfg.human : 0;
      board.setOrientation(orient);
      board.sync(game.pos.board, [], { instantAll: true });
      renderAll();

  }

  window.__gc = {
    get game() { return game; }, board: board, get premoves() { return premoves; }, get view() { return view; },
    displayBoard: displayBoard, startGame: startGame, gotoPly: gotoPly, tryMove: tryMove, setGoldenArmed: setGoldenArmed, flip: flip,
    takeback: takeback, onGoldenButton: onGoldenButton, setAnalysis: setAnalysis, get botBusy() { return !!botReq; }, settings: settings, applySettings: applySettings,
    premoveDests: premoveDests, viewFen: function () { return viewFen(); }, get reviewState() { return review; }, get exploreState() { return explore; }, startReview: startReview, exitExplore: exitExplore, navStep: navStep,
    get goldenArmed() { return goldenArmed; }, get selected() { return selected; }, get dialogOpen() { return !!currentDialog; }, closeDialog: closeDialog,
    get dialogKind() { return currentDialog ? currentDialog.dataset.kind || '' : null; },
    get online() { return online; }, get me() { return me; }, get lobby() { return lobby; }, startSeek: startSeek, startInvite: startInvite,
    onlineAction: onlineAction, showNewGame: showNewGame, serverNow: serverNow, cancelPremoves: cancelPremoves
  };
})();
