<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Golden Chess — Google</title>
<meta name="theme-color" content="#2a2f2d">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #2a2f2d; color: #f4efe4; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; }
  main { box-sizing: border-box; width: 100%; max-width: 420px; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); text-align: center; }
  h1 { font-size: 22px; margin: 14px 0 8px; }
  p { color: #b2bab5; margin: 0 0 22px; }
  a.go { display: block; height: 52px; line-height: 52px; border-radius: 14px; background: #f0b941; color: #1d1a12; font-weight: 800; text-decoration: none; box-shadow: 0 3px 0 #b8862a; }
  a.go[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1 6.1 3.4 8.5 9.5 9.5-6.1 1-8.5 3.4-9.5 9.5-1-6.1-3.4-8.5-9.5-9.5 6.1-1 8.5-3.4 9.5-9.5z" fill="#e7b44a"/></svg>
  <h1 id="t">Signing in…</h1>
  <p id="s"></p>
  <a class="go" id="go" href="./" hidden>Back to Golden Chess</a>
</main>
<script>
// Google's answer to "Continue with Google" (an ID token, or an error) lands here, on golden-chess.com, so Google's
// sign-in page names golden-chess.com. The state says where it goes on: the app (goldenchess://auth) or this site.
// The site / the app checks the state and the nonce and signs in with Supabase. Nothing is kept here.
(function () {
  var ru = /^ru\b/i.test(navigator.language || '');
  var h = location.hash.replace(/^#/, ''), q = new URLSearchParams(h), st = q.get('state') || '';
  var out = new URLSearchParams();
  ['state', 'id_token', 'error', 'error_description'].forEach(function (k) { if (q.get(k)) out.set('g_' + k, q.get(k)); });
  var go = document.getElementById('go'), t = document.getElementById('t'), s = document.getElementById('s');
  history.replaceState(null, '', location.pathname); // the token doesn't stay in the address or the history
  if (st.charAt(0) === 'a') {
    // the app: the system browser hands the answer to the app; if the browser asks first or blocks it, the button
    var url = 'goldenchess://auth#' + out.toString();
    go.href = url; go.hidden = false;
    go.textContent = ru ? 'Вернуться в приложение' : 'Back to the app';
    t.textContent = ru ? 'Вход через Google' : 'Signing in with Google';
    s.textContent = ru ? 'Если приложение не открылось само, нажмите кнопку.' : 'If the app didn’t open by itself, tap the button.';
    location.replace(url);
    return;
  }
  // the website (state "w", with the player profile after the dot, if any)
  var p = st.indexOf('.') > 0 ? st.slice(st.indexOf('.') + 1) : '';
  location.replace('./' + (p ? '?p=' + encodeURIComponent(p) : '') + '#' + out.toString());
})();
</script>
</body>
</html>
